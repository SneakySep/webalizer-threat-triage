[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-ra"
markers = [
    "integration: requires real PostgreSQL and Redis services",
    "e2e: requires a running app and a Playwright browser",
]
filterwarnings = [
    "ignore::DeprecationWarning:celery.*",
    "ignore::DeprecationWarning:kombu.*",
    "ignore::DeprecationWarning:pytest_asyncio.*",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/tasks/*", "app/celery_app.py"]
