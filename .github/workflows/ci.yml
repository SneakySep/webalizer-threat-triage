name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    name: Lint and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check app tests alembic scripts

      - name: Ruff format check
        run: ruff format --check app tests alembic scripts

      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  integration:
    name: Integration (PostgreSQL and Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: triage
          POSTGRES_PASSWORD: triage_test_password
          POSTGRES_DB: triage
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U triage -d triage"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      ENVIRONMENT: test
      VT_API_KEY: test-vt-key
      DATABASE_URL: postgresql+psycopg://triage:triage_test_password@localhost:5432/triage
      REDIS_URL: redis://localhost:6379/15
      CELERY_BROKER_URL: redis://localhost:6379/13
      CELERY_RESULT_BACKEND: redis://localhost:6379/14
      INTEGRATION_DATABASE_URL: postgresql+psycopg://triage:triage_test_password@localhost:5432/triage
      INTEGRATION_REDIS_URL: redis://localhost:6379/15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run integration tests
        run: pytest -m integration -q

  browser-e2e:
    name: Browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ENVIRONMENT: test
      VT_API_KEY: test-vt-key
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          playwright install --with-deps chromium

      - name: Run browser tests
        env:
          RUN_E2E: "1"
        run: pytest -m e2e -q

  docker-and-scripts:
    name: Docker and scripts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet

      - name: Build container image
        run: docker build --tag webalizer-threat-triage:ci .

      - name: Validate PowerShell helper
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path './scripts/enable-live-scans.ps1'),
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors) {
            $errors | Format-List
            exit 1
          }
